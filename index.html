<script>
  // Safariのdvh単位はタイミングによってズレることがあるため、
  // 実測のwindow.innerHeightをCSS変数として直接反映する。
  // ※ window.visualViewport はソフトキーボード表示時にも縮むため、
  //   意図せずアプリ全体が潰れてしまう原因になるのであえて使わない。
  function setAppHeight() {
    document.documentElement.style.setProperty("--app-height", window.innerHeight + "px");
  }
  setAppHeight();
  window.addEventListener("resize", setAppHeight);
  window.addEventListener("orientationchange", setAppHeight);
</script>
<script>
  window.__cdnFail = function (name) {
    document.addEventListener("DOMContentLoaded", function () { showFail(name); });
    if (document.readyState !== "loading") showFail(name);
    function showFail(name) {
      var root = document.getElementById("root");
      if (root) {
        root.innerHTML =
          '<div class="card"><div class="title">ちゃディ<span class="title-en">chatty</span></div>' +
          '<div class="error">' + name + ' の読み込みに失敗しました。通信環境を確認して、リロードしてみてください。</div></div>';
      }
    }
  };
</script>

    var root = document.getElementById("root");
    if (root) {
      root.innerHTML =
        '<div class="card"><div class="title">ちゃディ<span class="title-en">chatty</span></div>' +
        '<div class="error">読み込みエラー: ' +
        (e.reason && e.reason.message ? e.reason.message : String(e.reason)) +
        '</div></div>';
    }
  });
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ------------------------------------------------------------
// 1) Supabase connection — talked to directly via fetch(), no CDN library needed.
// ------------------------------------------------------------
const SUPABASE_URL = "https://apufjzexksgiwijjrvcw.supabase.co"; // ← 自分のProject URLに置き換えてください
const SUPABASE_ANON_KEY = "sb_publishable_BGqQL6BtoDwS_6teodze1w_rgQu16J0";

const AUTH_URL = SUPABASE_URL + "/auth/v1";
const REST_URL = SUPABASE_URL + "/rest/v1";
const STORAGE_URL = SUPABASE_URL + "/storage/v1";
const MEDIA_BUCKET = "post-media";
const SESSION_KEY = "chatty_session";

function mediaPublicUrl(path) {
  return STORAGE_URL + "/object/public/" + MEDIA_BUCKET + "/" + path;
}

// Supabase Storageへファイルをアップロードする(supabase-js非依存、fetchのみ)
async function uploadToStorage(path, file, session) {
  const res = await fetch(STORAGE_URL + "/object/" + MEDIA_BUCKET + "/" + path, {
    method: "POST",
    headers: {
      Authorization: "Bearer " + session.access_token,
      apikey: SUPABASE_ANON_KEY,
      "Content-Type": file.type || "application/octet-stream",
      "x-upsert": "true",
    },
    body: file,
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.message || data.error || "アップロードに失敗しました。");
  }
  return path;
}

// 動画ファイルの長さ(秒)を、実際に読み込んで取得する
function getVideoDuration(file) {
  return new Promise((resolve) => {
    const video = document.createElement("video");
    video.preload = "metadata";
    video.onloadedmetadata = () => {
      URL.revokeObjectURL(video.src);
      resolve(video.duration || 0);
    };
    video.onerror = () => resolve(0);
    video.src = URL.createObjectURL(file);
  });
}

function saveSession(session) {
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));
}
function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}
function clearSession() {
  localStorage.removeItem(SESSION_KEY);
}

async function authFetch(path, options = {}) {
  const res = await fetch(AUTH_URL + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      apikey: SUPABASE_ANON_KEY,
      ...(options.headers || {}),
    },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data.error_description || data.msg || data.error || "認証エラーが発生しました。");
  }
  return data;
}

async function restFetch(path, session, options = {}) {
  const res = await fetch(REST_URL + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      apikey: SUPABASE_ANON_KEY,
      Authorization: "Bearer " + (session ? session.access_token : SUPABASE_ANON_KEY),
      ...(options.headers || {}),
    },
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    throw new Error((data && (data.message || data.error)) || "データベースエラーが発生しました。");
  }
  return data;
}

// そのユーザーの「今日1日だけ」固定になる匿名番号を作る。
// user_id + 今日の日付 から決定的に計算するので、同じ人は同じ日なら同じ番号になり、
// 日付が変われば自動的に別の番号になる(誰かは分からないが「昨日と同じ人か」は追える)。
function dailyAnonNumber(userId) {
  const dateStr = new Date().toISOString().slice(0, 10); // "2026-08-11"
  const str = (userId || "") + dateStr;
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
  }
  return 1000 + (hash % 9000);
}

function boardInfo(id) {

const TAB_ORDER = ["home", "board", "search", "user"];

// 返信一覧を「トップレベルの返信」と「特定の返信へのぶら下がり返信(@メンション)」に
// クライアント側で仕分けする。YouTubeのコメント欄のように、返信への返信は
// タップするまで折りたたんでおくための下準備。
function groupReplies(replies) {
  const handleToLatestId = {};
  const childrenOf = {};
  const topLevel = [];
  (replies || []).forEach((r) => {
    const m = /^@(\S+)\s+/.exec(r.body || "");
    const parentId = m ? handleToLatestId[m[1]] : undefined;
    if (parentId !== undefined) {
      if (!childrenOf[parentId]) childrenOf[parentId] = [];
      childrenOf[parentId].push(r);
    } else {
      topLevel.push(r);
    }
    handleToLatestId[r.author_handle] = r.id;
  });
  return { topLevel, childrenOf };
}

function formatTime(iso) {
  const d = new Date(iso);
  const diffSec = Math.floor((Date.now() - d.getTime()) / 1000);
  if (diffSec < 60) return diffSec + "秒前";
  if (diffSec < 3600) return Math.floor(diffSec / 60) + "分前";
  if (diffSec < 86400) return Math.floor(diffSec / 3600) + "時間前";
  return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
}

    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartRef.current.x;

    // 横方向にしっかり動いた時だけ反応(縦スクロールとの誤反応を防ぐ)
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.2) {

  useEffect(() => {

          const refreshed = await authFetch("/token?grant_type=refresh_token", {
            method: "POST",
            body: JSON.stringify({ refresh_token: activeSession.refresh_token }),
          });
          const newSession = {
            access_token: refreshed.access_token,
            refresh_token: refreshed.refresh_token,
          };
          saveSession(newSession);
          activeSession = newSession;
          me = await authFetch("/user", {
            headers: { Authorization: "Bearer " + activeSession.access_token },
          });

        const withEmail = { ...activeSession, user: me };
        saveSession(activeSession);
        setSession(withEmail);

        clearSession();
        setSession(null);
        setProfile(null);
        setError("セッションの有効期限が切れました。もう一度ログインしてください。");
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [session && session.access_token]);

  // restFetch()のラッパー。JWT期限切れを検知したら自動でトークンを更新し、
  // 新しいトークンでもう一度だけリクエストし直す。それでもダメならログイン画面へ戻す。
  const authedFetch = async (path, sess, options = {}) => {
    try {
      return await restFetch(path, sess || session, options);
    } catch (err) {
      const msg = (err && err.message) || "";
      if (/jwt|token/i.test(msg) && session && session.refresh_token) {
        try {
          const refreshed = await authFetch("/token?grant_type=refresh_token", {
            method: "POST",
            body: JSON.stringify({ refresh_token: session.refresh_token }),

          const newSession = {
            ...session,

            refresh_token: refreshed.refresh_token,
          };
          saveSession(newSession);
          setSession(newSession);
          return await restFetch(path, newSession, options);
        } catch (refreshErr) {
          clearSession();
          setSession(null);
          setProfile(null);
          setError("セッションの有効期限が切れました。もう一度ログインしてください。");

        setReplyCounts({});

      setFeedError(err.message || "投稿の読み込みに失敗しました。");

  // プロフィールのテーマ設定が変わったら画面に反映する
  useEffect(() => {
    if (profile && profile.theme) applyTheme(profile.theme);
  }, [profile && profile.theme]);

  // プロフィールが揃った時、または掲示板を切り替えた時に読み込む
  useEffect(() => {
    if (session && profile && !boardInfo(currentBoard).comingSoon) loadFeed();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [session && profile && profile.id, currentBoard]);

  const handleCreatePost = async (e) => {
    e.preventDefault();
    if (!newPostText.trim() && composerFiles.length === 0) return;
    if ((profile.points || 0) < 1) {
      setFeedError("ポイントが足りません。ログインボーナス(1日1回+2pt)を待つか、いいねを増やして貯めてください。");
      return;
    }
    setPosting(true);
    setFeedError("");
    const anonHandle = "名無しさん#" + dailyAnonNumber(session.user.id);
    try {
      const createdRows = await authedFetch("/posts", session, {
        method: "POST",
        headers: { Prefer: "return=representation" },
        body: JSON.stringify({
          author_id: session.user.id,
          author_handle: newPostAnonymous ? anonHandle : profile.handle,
          author_avatar: "",
          is_anonymous: newPostAnonymous,
          lang: "ja",
          board: currentBoard,
          has_image: composerFiles.length > 0,
          body: newPostText.trim(),
        }),
      });
      const newPost = createdRows && createdRows[0];

      if (newPost && composerFiles.length > 0) {
        setMediaUploading(true);
        let i = 0;
        for (const item of composerFiles) {
          const ext = (item.file.name.split(".").pop() || "bin").toLowerCase();
          const path = session.user.id + "/" + newPost.id + "/" + i + "-" + Date.now() + "." + ext;
          try {
            await uploadToStorage(path, item.file, session);
            await authedFetch("/post_media", session, {
              method: "POST",
              body: JSON.stringify({
                post_id: newPost.id,
                media_type: item.type,
                path: path,
                position: i,
              }),
            });
          } catch (uploadErr) {
            setFeedError((uploadErr && uploadErr.message) || "一部のファイルのアップロードに失敗しました。");
          }
          i++;
        }
        setMediaUploading(false);
      }

      setNewPostText("");
      setNewPostAnonymous(false);
      composerFiles.forEach((f) => URL.revokeObjectURL(f.previewUrl));
      setComposerFiles([]);
      await loadFeed();
      // スレッドを1個建てたので1ポイント消費する
      try {
        const updated = await authedFetch("/profiles?id=eq." + session.user.id, session, {
          method: "PATCH",
          headers: { Prefer: "return=representation" },
          body: JSON.stringify({ points: (profile.points || 0) - 1 }),
        });
        if (updated && updated[0]) setProfile(updated[0]);
      } catch (pointErr) {
        // ポイント減算に失敗しても投稿自体は成功しているので静かに無視
      }
    } catch (err) {
      setFeedError(err.message || "投稿に失敗しました。");
    } finally {
      setPosting(false);
    }
  };

  const handleToggleLike = async (postId) => {
    const alreadyLiked = likedSet.has(postId);
    // 先に画面だけ更新(体感速度優先)、失敗したら読み直す
    setLikedSet((prev) => {
      const next = new Set(prev);
      if (alreadyLiked) next.delete(postId); else next.add(postId);
      return next;
    });
    setLikeCounts((prev) => ({
      ...prev,
      [postId]: (prev[postId] || 0) + (alreadyLiked ? -1 : 1),
    }));
    try {
      if (alreadyLiked) {
        await authedFetch(
          "/likes?post_id=eq." + postId + "&user_id=eq." + session.user.id,
          session,
          { method: "DELETE" }
        );
      } else {
        await authedFetch("/likes", session, {
          method: "POST",
          body: JSON.stringify({ post_id: postId, user_id: session.user.id }),
        });
      }
    } catch (err) {
      loadFeed();
    }
  };

  // 指定した投稿の返信一覧を読み込む
  const loadReplies = async (postId) => {
    setRepliesLoading((prev) => ({ ...prev, [postId]: true }));
    try {
      const rows = await authedFetch(
        "/posts?parent_id=eq." + postId + "&deleted=eq.false&select=*&order=created_at.asc",
        session
      );
      setRepliesByPost((prev) => ({ ...prev, [postId]: rows || [] }));
      fetchAuthorUsernames(rows);

      // トップレベルの返信それぞれに対する「返信への返信」も、まとめて1回で取得する
      let childRows = [];
      if (rows && rows.length > 0) {
        const topIds = rows.map((r) => r.id).join(",");
        childRows = await authedFetch(
          "/posts?parent_id=in.(" + topIds + ")&deleted=eq.false&select=*&order=created_at.asc",
          session
        );
        fetchAuthorUsernames(childRows);
      }
      const childrenMap = {};
      (childRows || []).forEach((c) => {
        if (!childrenMap[c.parent_id]) childrenMap[c.parent_id] = [];
        childrenMap[c.parent_id].push(c);
      });
      setNestedRepliesByPost((prev) => ({ ...prev, [postId]: childrenMap }));

      const allIds = [...(rows || []).map((r) => r.id), ...(childRows || []).map((c) => c.id)];
      if (allIds.length > 0) {
        const ids = allIds.join(",");
        const stats = await authedFetch(
          "/post_stats?post_id=in.(" + ids + ")&select=post_id,like_count",
          session
        );
        setLikeCounts((prev) => {
          const next = { ...prev };
          (stats || []).forEach((s) => { next[s.post_id] = s.like_count; });
          return next;
        });

        const mine = await authedFetch(
          "/likes?user_id=eq." + session.user.id + "&post_id=in.(" + ids + ")&select=post_id",
          session
        );
        setLikedSet((prev) => {
          const next = new Set(prev);
          (mine || []).forEach((m) => next.add(m.post_id));
          return next;
        });

        const myFavs = await authedFetch(
          "/favorites?user_id=eq." + session.user.id + "&post_id=in.(" + ids + ")&select=post_id",
          session
        );
        setFavoritedSet((prev) => {
          const next = new Set(prev);
          (myFavs || []).forEach((f) => next.add(f.post_id));
          return next;
        });
      }
    } catch (err) {
      setFeedError(err.message || "返信の読み込みに失敗しました。");
    } finally {
      setRepliesLoading((prev) => ({ ...prev, [postId]: false }));
    }
  };

  const handleToggleReplies = (postId) => {
    if (expandedId === postId) {
      setExpandedId(null);
      return;
    }
    setExpandedId(postId);
    if (!repliesByPost[postId]) loadReplies(postId);
  };

  const handleCreateReply = async (postId) => {
    const text = (replyDrafts[postId] || "").trim();
    if (!text) return;
    const target = replyTargetId[postId]; // 指定があれば「返信への返信」、無ければスレッド本体への返信
    const actualParentId = target ? target.id : postId;
    const bodyToSend = target ? "＞" + target.handle + "\n" + text : text;
    const isAnon = !!replyAnonDrafts[postId];
    const anonHandle = "名無しさん#" + dailyAnonNumber(session.user.id);
    setPostingReply((prev) => ({ ...prev, [postId]: true }));
    setFeedError("");
    try {
      const created = await authedFetch("/posts", session, {
        method: "POST",
        headers: { Prefer: "return=representation" },
        body: JSON.stringify({
          author_id: session.user.id,
          author_handle: isAnon ? anonHandle : profile.handle,
          author_avatar: "",
          is_anonymous: isAnon,
          lang: "ja",
          board: currentBoard,
          parent_id: actualParentId,
          body: bodyToSend,
        }),
      });
      // 「返信への返信」の場合だけ、宛先の人に通知を送る(スレッド本体への返信では通知しない)
      if (target && target.authorId && target.authorId !== session.user.id && created && created[0]) {
        try {
          await authedFetch("/notifications", session, {
            method: "POST",
            body: JSON.stringify({
              recipient_id: target.authorId,
              actor_id: session.user.id,
              actor_handle: isAnon ? anonHandle : profile.handle,
              post_id: created[0].id,
              parent_post_id: target.id,
              board: currentBoard,
              excerpt: text.slice(0, 60),
            }),
          });
        } catch (notifyErr) {
          // 通知の作成に失敗しても、返信自体は成功しているので無視する
        }
      }
      setReplyDrafts((prev) => ({ ...prev, [postId]: "" }));
      setReplyAnonDrafts((prev) => ({ ...prev, [postId]: false }));
      setReplyTargetId((prev) => {
        const next = { ...prev };
        delete next[postId];
        return next;
      });
      await loadReplies(postId);
      if (actualParentId === postId) {
        setReplyCounts((prev) => ({ ...prev, [postId]: (prev[postId] || 0) + 1 }));
      }
      if (target) setExpandedReplyChildren((prev) => ({ ...prev, [target.id]: true }));
      // 返信がついたスレッドを、サーバーの反映を待たずにその場で一番上へ動かす
      const nowIso = new Date().toISOString();
      setThreads((prev) => {
        const idx = prev.findIndex((p) => p.id === postId);
        if (idx === -1) return prev;
        const bumped = { ...prev[idx], last_activity_at: nowIso };
        const next = prev.filter((p) => p.id !== postId);
        next.unshift(bumped);
        return next;
      });
    } catch (err) {
      setFeedError(err.message || "返信に失敗しました。");
    } finally {
      setPostingReply((prev) => ({ ...prev, [postId]: false }));
    }
  };

  // 他ユーザーのプロフィール・フォロワー数・自分がフォロー済みかを読み込む
  const loadViewedProfile = async (userId) => {
    setViewedLoading(true);
    setFeedError("");
    try {
      const rows = await authedFetch("/profiles?id=eq." + userId + "&select=*", session);
      setViewedProfile((rows && rows[0]) || null);

      const followers = await authedFetch(
        "/follows?followee_id=eq." + userId + "&select=follower_id",
        session
      );
      setFollowerCount((followers || []).length);

      const following = await authedFetch(
        "/follows?follower_id=eq." + userId + "&select=followee_id",
        session
      );
      setFollowingCount((following || []).length);

      const mine = await authedFetch(
        "/follows?follower_id=eq." + session.user.id + "&followee_id=eq." + userId + "&select=follower_id",
        session
      );
      setViewedFollowing((mine || []).length > 0);

      setViewedPostsLoading(true);
      const posts = await authedFetch(
        "/posts?author_id=eq." + userId + "&parent_id=is.null&deleted=eq.false&is_anonymous=eq.false&select=*&order=created_at.desc&limit=50",
        session
      );
      setViewedPosts(posts || []);
      fetchAuthorUsernames(posts);
      setViewedPostsLoading(false);
    } catch (err) {
      setFeedError(err.message || "プロフィールの読み込みに失敗しました。");
    } finally {
      setViewedLoading(false);
    }
  };

  const openProfile = (userId) => {
    if (!userId || userId === session.user.id) return; // 自分の投稿では開かない
    setViewedUserId(userId);
    loadViewedProfile(userId);
  };

  const closeProfile = () => {
    setViewedUserId(null);
    setViewedProfile(null);
  };

  const handleToggleFollow = async () => {
    if (!viewedUserId) return;
    setFollowBusy(true);
    setFeedError("");
    try {
      if (viewedFollowing) {
        await authedFetch(
          "/follows?follower_id=eq." + session.user.id + "&followee_id=eq." + viewedUserId,
          session,
          { method: "DELETE" }
        );
        setViewedFollowing(false);
        setFollowerCount((c) => Math.max(0, c - 1));
      } else {
        await authedFetch("/follows", session, {
          method: "POST",
          body: JSON.stringify({ follower_id: session.user.id, followee_id: viewedUserId }),
        });
        setViewedFollowing(true);
        setFollowerCount((c) => c + 1);
      }
    } catch (err) {
      setFeedError(err.message || "フォロー操作に失敗しました。");
    } finally {
      setFollowBusy(false);
    }
  };

  // 自分の投稿一覧(全掲示板分)を読み込む
  const loadMyPosts = async () => {
    setMyPostsLoading(true);
    try {
      const rows = await authedFetch(
        "/posts?author_id=eq." + session.user.id + "&parent_id=is.null&deleted=eq.false&select=*&order=created_at.desc&limit=50",

      );
      setMyPosts(rows || []);
      fetchAuthorUsernames(rows);
    } catch (err) {
      setFeedError(err.message || "投稿の読み込みに失敗しました。");
    } finally {
      setMyPostsLoading(false);
    }
  };

  // 自分がお気に入り登録した投稿一覧を読み込む
  const loadMyFavorites = async () => {
    setMyFavLoading(true);
    try {
      const favs = await authedFetch(
        "/favorites?user_id=eq." + session.user.id + "&select=post_id&order=created_at.desc&limit=50",
        session
      );
      const ids = (favs || []).map((f) => f.post_id);
      if (ids.length === 0) {
        setMyFavPosts([]);
        return;
      }
      const rows = await authedFetch(
        "/posts?id=in.(" + ids.join(",") + ")&deleted=eq.false&select=*",

      );
      // お気に入りに追加した順番を保つ
      const byId = new Map((rows || []).map((r) => [r.id, r]));
      setMyFavPosts(ids.map((id) => byId.get(id)).filter(Boolean));
    } catch (err) {
      setFeedError(err.message || "お気に入りの読み込みに失敗しました。");
    } finally {
      setMyFavLoading(false);
    }
  };

  // 自分のフォロワー数・フォロー中の数を読み込む
  const loadMyFollowCounts = async () => {
    try {
      const followers = await authedFetch(
        "/follows?followee_id=eq." + session.user.id + "&select=follower_id",
        session
      );
      setMyFollowerCount((followers || []).length);

      const following = await authedFetch(
        "/follows?follower_id=eq." + session.user.id + "&select=followee_id",
        session
      );
      setMyFollowingCount((following || []).length);
    } catch (err) {
      // フォロー数の取得失敗はサイレントに無視(致命的ではないため)
    }
  };

  // フォロワー一覧・フォロー中一覧を読み込んで表示する
  const openFollowList = async (userId, mode) => {
    setFollowListMode(mode);
    setFollowListLoading(true);
    setFollowListUsers([]);
    setFeedError("");
    try {
      const field = mode === "followers" ? "followee_id" : "follower_id";
      const otherField = mode === "followers" ? "follower_id" : "followee_id";
      const rows = await authedFetch(
        "/follows?" + field + "=eq." + userId + "&select=" + otherField,
        session
      );
      const ids = (rows || []).map((r) => r[otherField]);
      if (ids.length === 0) {
        setFollowListUsers([]);
        return;
      }
      const profiles = await authedFetch(
        "/profiles?id=in.(" + ids.join(",") + ")&select=id,handle,username,bio",
        session
      );
      setFollowListUsers(profiles || []);
    } catch (err) {
      setFeedError(err.message || "一覧の読み込みに失敗しました。");
    } finally {
      setFollowListLoading(false);
    }
  };

  const closeFollowList = () => {
    setFollowListMode(null);
    setFollowListUsers([]);
  };

  // 未読通知の件数だけをさっと取得する(バッジ表示用)
  const loadNotifUnreadCount = async (sess) => {
    const s = sess || session;
    if (!s || !s.user) return;
    try {
      const rows = await authedFetch(
        "/notifications?recipient_id=eq." + s.user.id + "&is_read=eq.false&select=id",
        s
      );
      setNotifUnreadCount((rows || []).length);
    } catch (err) {
      // バッジ表示のおまけ情報なので、失敗しても無視
    }
  };

  // 通知一覧を開く。開いたタイミングで未読を全部既読にする
  const openNotifications = async () => {
    setShowNotifications(true);
    setNotifLoading(true);
    setFeedError("");
    try {
      const rows = await authedFetch(
        "/notifications?recipient_id=eq." + session.user.id + "&select=*&order=created_at.desc&limit=50",
        session
      );
      setNotifications(rows || []);
      const unreadIds = (rows || []).filter((n) => !n.is_read).map((n) => n.id);
      if (unreadIds.length > 0) {
        await authedFetch("/notifications?id=in.(" + unreadIds.join(",") + ")", session, {
          method: "PATCH",
          body: JSON.stringify({ is_read: true }),
        });
        setNotifUnreadCount(0);
      }
      // それぞれの通知が指すコメントの、いいね数・お気に入り状態も一緒に取得する
      const postIds = Array.from(new Set((rows || []).map((n) => n.post_id)));
      if (postIds.length > 0) {
        const ids = postIds.join(",");
        const stats = await authedFetch("/post_stats?post_id=in.(" + ids + ")&select=post_id,like_count", session);
        setLikeCounts((prev) => {
          const next = { ...prev };
          (stats || []).forEach((s) => { next[s.post_id] = s.like_count; });
          return next;
        });
        const mine = await authedFetch(
          "/likes?user_id=eq." + session.user.id + "&post_id=in.(" + ids + ")&select=post_id",
          session
        );
        setLikedSet((prev) => {
          const next = new Set(prev);
          (mine || []).forEach((m) => next.add(m.post_id));
          return next;
        });
        const myFavs = await authedFetch(
          "/favorites?user_id=eq." + session.user.id + "&post_id=in.(" + ids + ")&select=post_id",
          session
        );
        setFavoritedSet((prev) => {
          const next = new Set(prev);
          (myFavs || []).forEach((f) => next.add(f.post_id));
          return next;
        });
      }
    } catch (err) {
      setFeedError(err.message || "お知らせの読み込みに失敗しました。");
    } finally {
      setNotifLoading(false);
    }
  };
  const closeNotifications = () => setShowNotifications(false);

  // 通知一覧のその場で、そのコメントへ返信する
  const [notifReplyOpenId, setNotifReplyOpenId] = useState(null);
  const [notifReplyDraft, setNotifReplyDraft] = useState("");
  const [notifReplyAnon, setNotifReplyAnon] = useState(false);
  const [notifReplyBusy, setNotifReplyBusy] = useState(false);

  const submitNotifReply = async (n) => {
    const text = notifReplyDraft.trim();
    if (!text) return;
    setNotifReplyBusy(true);
    setFeedError("");
    const isAnon = notifReplyAnon;
    const anonHandle = "名無しさん#" + dailyAnonNumber(session.user.id);
    try {
      const created = await authedFetch("/posts", session, {
        method: "POST",
        headers: { Prefer: "return=representation" },
        body: JSON.stringify({
          author_id: session.user.id,
          author_handle: isAnon ? anonHandle : profile.handle,
          author_avatar: "",
          is_anonymous: isAnon,
          lang: "ja",
          board: n.board,
          parent_id: n.post_id,
          body: "＞" + n.actor_handle + "\n" + text,
        }),
      });
      if (n.actor_id && n.actor_id !== session.user.id && created && created[0]) {
        try {
          await authedFetch("/notifications", session, {
            method: "POST",
            body: JSON.stringify({
              recipient_id: n.actor_id,
              actor_id: session.user.id,
              actor_handle: isAnon ? anonHandle : profile.handle,
              post_id: created[0].id,
              parent_post_id: n.post_id,
              board: n.board,
              excerpt: text.slice(0, 60),
            }),
          });

      setNotifReplyDraft("");
      setNotifReplyOpenId(null);
    } catch (err) {
      setFeedError(err.message || "返信に失敗しました。");
    } finally {
      setNotifReplyBusy(false);
    }
  };

  // 投稿・返信のidから、その大元のスレッドを特定して、掲示板タブでそのスレッドを
  // 展開した状態にジャンプする(通知やメインフィードのタップ移動用)
  // scrollTargetIdが指す要素が実際にDOMへ現れたら、その位置まで自動でスクロールする。
  // データの読み込みタイミングがズレることがあるので、依存配列での即時チェックに加えて、
  // 少し時間を空けて複数回リトライすることで確実性を上げる。
  useEffect(() => {
    if (!scrollTargetId) return;
    const el = document.getElementById("post-" + scrollTargetId);
    if (el) {
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      setScrollTargetId(null);
    }
  }, [scrollTargetId, activeTab, currentBoard, threads, repliesByPost, nestedRepliesByPost, expandedReplyChildren]);

  useEffect(() => {
    if (!scrollTargetId) return;
    const attempts = [200, 500, 900, 1500, 2200];
    const timers = attempts.map((delay) =>
      setTimeout(() => {
        setScrollTargetId((current) => {
          if (!current) return current;
          const el = document.getElementById("post-" + current);
          if (el) {
            el.scrollIntoView({ behavior: "smooth", block: "center" });
            return null;
          }
          return current;
        });
      }, delay)
    );
    return () => timers.forEach((t) => clearTimeout(t));
  }, [scrollTargetId]);

  const goToPost = async (postId) => {
    setFeedError("");
    try {
      const rows = await authedFetch("/posts?id=eq." + postId + "&select=*", session);
      const post = rows && rows[0];
      if (!post) return;

      let threadId = null;
      let threadBoard = null;

      if (!post.parent_id) {
        threadId = post.id;
        threadBoard = post.board;
      } else {
        const parentRows = await authedFetch("/posts?id=eq." + post.parent_id + "&select=*", session);
        const parent = parentRows && parentRows[0];
        if (parent && !parent.parent_id) {
          threadId = parent.id;
          threadBoard = parent.board;
        } else if (parent) {
          const grandRows = await authedFetch("/posts?id=eq." + parent.parent_id + "&select=*", session);
          const grand = grandRows && grandRows[0];
          threadId = grand ? grand.id : parent.id;
          threadBoard = grand ? grand.board : parent.board;
          // ネストされた返信への通知なら、その折りたたみも自動で開く
          setExpandedReplyChildren((prev) => ({ ...prev, [parent.id]: true }));
        }
      }
      if (!threadId) return;

      setShowNotifications(false);
      setCurrentBoard(threadBoard);
      goToTab("board");
      setExpandedId(threadId);
      loadReplies(threadId);
      setScrollTargetId(postId); // このidの要素が表示されたら自動でスクロールする
    } catch (err) {
      setFeedError(err.message || "移動に失敗しました。");
    }
  };

  // フォロー中の人たちの投稿(全掲示板)を読み込む
  const loadHomeFeed = async () => {
    setHomeFeedLoading(true);
    setFeedError("");
    try {
      const following = await authedFetch(
        "/follows?follower_id=eq." + session.user.id + "&select=followee_id",
        session
      );
      const ids = (following || []).map((f) => f.followee_id);
      if (ids.length === 0) {
        setHomeFeed([]);
        return;
      }
      const rows = await authedFetch(
        "/posts?author_id=in.(" + ids.join(",") + ")&parent_id=is.null&deleted=eq.false&is_anonymous=eq.false&select=*&order=created_at.desc&limit=50",
        session
      );
      setHomeFeed(rows || []);
      fetchAuthorUsernames(rows);
    } catch (err) {
      setFeedError(err.message || "読み込みに失敗しました。");
    } finally {
      setHomeFeedLoading(false);
    }
  };

  // ユーザー・スレッドの検索
  const handleSearch = async (e) => {
    if (e) e.preventDefault();
    const q = searchQuery.trim();
    if (!q) return;
    setSearching(true);
    setFeedError("");
    try {
      const users = await authedFetch(
        "/profiles?handle=ilike.*" + encodeURIComponent(q) + "*&select=id,handle,bio&limit=20",
        session
      );
      setSearchUsers(users || []);
      const posts = await authedFetch(
        "/posts?body=ilike.*" + encodeURIComponent(q) + "*&parent_id=is.null&deleted=eq.false&select=*&order=created_at.desc&limit=20",
        session
      );
      setSearchThreads(posts || []);
      fetchAuthorUsernames(posts);
    } catch (err) {
      setFeedError(err.message || "検索に失敗しました。");
    } finally {
      setSearching(false);
    }
  };

  // タブが切り替わった時の読み込み・テーマのプレビュー巻き戻し
  useEffect(() => {
    if (!session || !profile) return;
    if (activeTab === "home") loadHomeFeed();
    if (activeTab === "user" && !viewedUserId) {
      applyTheme(profile.theme || "orange"); // 未保存プレビューを巻き戻す
      setBioDraft(profile.bio || "");
      setHandleDraft(profile.handle || "");
      setUsernameDraft(profile.username || "");
      setThemeDraft(profile.theme || "orange");
      setEditingProfile(false);
      loadMyPosts();
      loadMyFavorites();
      loadMyFollowCounts();
    } else if (activeTab !== "user") {
      applyTheme(profile.theme || "orange"); // 未保存プレビューを巻き戻す
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [activeTab, session && profile && profile.id]);

  const openMyProfile = () => {
    goToTab("user");
  };

  const saveProfileEdits = async () => {
    setSavingProfile(true);
    setProfileSaveError("");
    setProfileSaveNotice("");
    try {
      const rows = await authedFetch("/profiles?id=eq." + session.user.id, session, {
        method: "PATCH",
        headers: { Prefer: "return=representation" },
        body: JSON.stringify({
          handle: handleDraft.trim() || profile.handle,
          bio: bioDraft,
          theme: themeDraft,
        }),
      });
      if (rows && rows[0]) setProfile(rows[0]);
      setProfileSaveNotice("保存しました。");
    } catch (err) {
      setProfileSaveError((err && err.message) || "保存に失敗しました。");
    } finally {
      setSavingProfile(false);
    }
  };

  const handleToggleFavorite = async (postId) => {
    const already = favoritedSet.has(postId);
    setFavoritedSet((prev) => {
      const next = new Set(prev);
      if (already) next.delete(postId); else next.add(postId);
      return next;
    });
    try {
      if (already) {
        await authedFetch(
          "/favorites?post_id=eq." + postId + "&user_id=eq." + session.user.id,
          session,
          { method: "DELETE" }
        );
      } else {
        await authedFetch("/favorites", session, {
          method: "POST",
          body: JSON.stringify({ post_id: postId, user_id: session.user.id }),
        });
      }
    } catch (err) {
      loadFeed();
    }
  };

  // 掲示板カテゴリの並び順を読み込む(保存されていなければデフォルト順のまま)
  const loadBoardOrder = async (sess) => {
    const s = sess || session;
    if (!s || !s.user) return;
    try {
      const rows = await authedFetch(
        "/board_order?user_id=eq." + s.user.id + "&select=board_ids",
        s
      );
      if (rows && rows[0] && Array.isArray(rows[0].board_ids) && rows[0].board_ids.length > 0) {
        const saved = rows[0].board_ids.filter((id) => BOARDS.some((b) => b.id === id));
        const missing = BOARDS.map((b) => b.id).filter((id) => !saved.includes(id));
        setBoardOrder([...saved, ...missing]);
      }
    } catch (err) {
      // 保存済みの並び順がまだ無い場合はここに来る。デフォルト順のままでOK。
    }
  };

  const saveBoardOrder = async (newOrder) => {
    try {
      await authedFetch("/board_order", session, {
        method: "POST",
        headers: { Prefer: "resolution=merge-duplicates" },
        body: JSON.stringify({ user_id: session.user.id, board_ids: newOrder }),
      });
    } catch (err) {
      setFeedError(err.message || "並び順の保存に失敗しました。");
    }
  };

  const moveBoardOrder = (id, direction) => {
    setBoardOrder((prev) => {
      const idx = prev.indexOf(id);
      const swapIdx = idx + direction;
      if (swapIdx < 0 || swapIdx >= prev.length) return prev;
      const next = [...prev];
      [next[idx], next[swapIdx]] = [next[swapIdx], next[idx]];
      saveBoardOrder(next);
      return next;
    });
  };

  const handleEmailAuth = async (e) => {
    e.preventDefault();
    setError("");
    setNotice("");
    setBusy(true);
    try {
      if (mode === "signup") {
        await authFetch("/signup", {
          method: "POST",
          body: JSON.stringify({ email, password }),
        });
        setNotice("登録できました。届いたメールのリンクをタップして認証を完了してください。");
      } else {
        const data = await authFetch("/token?grant_type=password", {
          method: "POST",
          body: JSON.stringify({ email, password }),
        });
        const newSession = { access_token: data.access_token, refresh_token: data.refresh_token };
        saveSession(newSession);
        setSession(newSession);
      }
    } catch (err) {
      setError(err.message || "エラーが発生しました。");
    } finally {
      setBusy(false);
    }
  };

  const handleGoogleAuth = () => {
    const redirectTo = window.location.href.split("#")[0];
    window.location.href =
      AUTH_URL + "/authorize?provider=google&redirect_to=" + encodeURIComponent(redirectTo);
  };

  const handleLogout = () => {
    clearSession();
    setSession(null);
    setProfile(null);
  };

  const createProfile = async (e) => {
    e.preventDefault();
    setError("");
    const trimmedUsername = signupUsername.trim();
    if (!trimmedUsername) {
      setError("ユーザーIDを入力してください。");
      return;
    }
    if (!/^[a-zA-Z0-9_]{3,20}$/.test(trimmedUsername)) {
      setError("ユーザーIDは半角英数字と_(アンダースコア)のみ、3〜20文字で入力してください。");
      return;
    }
    setBusy(true);
    try {
      const finalHandle = handle.trim() || `名無しさん#${Math.floor(1000 + Math.random() * 9000)}`;
      const rows = await authedFetch("/profiles", session, {
        method: "POST",
        headers: { Prefer: "return=representation" },
        body: JSON.stringify({ id: session.user.id, handle: finalHandle, username: trimmedUsername }),
      });
      setProfile(rows[0]);
    } catch (err) {
      const msg = (err && err.message) || "";
      if (/duplicate|unique/i.test(msg)) {
        setError("そのユーザーIDはすでに使われています。別のIDを試してください。");
      } else if (/username_format/i.test(msg)) {
        setError("ユーザーIDは半角英数字と_(アンダースコア)のみ、3〜20文字で入力してください。");
      } else {
        setError(msg || "プロフィールの作成に失敗しました。");
      }
    } finally {
      setBusy(false);
    }
  };

  if (loadingSession) {
    return <div className="card">読み込み中…</div>;
  }

  if (session && profile) {
    if (showNotifications) {
      return (
        <div className="card board">
          <button className="btn ghost back-btn" onClick={closeNotifications}>← 戻る</button>
          <div className="board-sub">🔔 お知らせ</div>
          {feedError && <div className="error">{feedError}</div>}
          {notifLoading ? (
            <div className="empty">読み込み中…</div>
          ) : notifications.length === 0 ? (
            <div className="empty">まだお知らせがありません。誰かがあなたのコメントに返信すると、ここに表示されます。</div>
          ) : (
            <div className="feed">
              {notifications.map((n) => (
                <div className="post-card" key={n.id}>
                  <div className="post-head" style={{ cursor: "pointer" }} onClick={() => goToPost(n.post_id)}>
                    <span className="post-author">{n.actor_handle}</span>
                    <span className="post-time">{formatTime(n.created_at)}</span>
                  </div>
                  <div
                    className="my-post-board"
                    style={{ marginBottom: 4, cursor: "pointer" }}
                    onClick={() => goToPost(n.post_id)}
                  >
                    {boardInfo(n.board).emoji} {boardInfo(n.board).name} であなたのコメントに返信しました
                  </div>
                  <div className="post-body" style={{ cursor: "pointer" }} onClick={() => goToPost(n.post_id)}>
                    {n.excerpt}
                  </div>
                  <div className="post-actions">
                    <button
                      className={"like-btn" + (likedSet.has(n.post_id) ? " liked" : "")}
                      onClick={() => handleToggleLike(n.post_id)}
                    >
                      {likedSet.has(n.post_id) ? "♥" : "♡"} {likeCounts[n.post_id] || 0}
                    </button>
                    <button
                      className="reply-toggle-btn"
                      onClick={() =>
                        setNotifReplyOpenId((prev) => (prev === n.id ? null : n.id))
                      }
                    >
                      💬 返信
                    </button>
                    <button
                      className={"fav-btn" + (favoritedSet.has(n.post_id) ? " faved" : "")}
                      onClick={() => handleToggleFavorite(n.post_id)}
                    >
                      {favoritedSet.has(n.post_id) ? "★" : "☆"}
                    </button>
                  </div>

                  {notifReplyOpenId === n.id && (
                    <div style={{ marginTop: 8 }}>
                      <div className="reply-composer">
                        <input
                          className="reply-input"
                          placeholder="返信する…"
                          value={notifReplyDraft}
                          onChange={(e) => setNotifReplyDraft(e.target.value)}
                          onKeyDown={(e) => { if (e.key === "Enter") submitNotifReply(n); }}
                        />
                        <button
                          className="btn"
                          style={{ width: "auto", padding: "7px 14px", marginBottom: 0 }}
                          disabled={notifReplyBusy || !notifReplyDraft.trim()}
                          onClick={() => submitNotifReply(n)}
                        >
                          {notifReplyBusy ? "…" : "送信"}
                        </button>
                      </div>
                      <label className="anon-toggle" style={{ marginTop: 6 }}>
                        <input
                          type="checkbox"
                          checked={notifReplyAnon}
                          onChange={(e) => setNotifReplyAnon(e.target.checked)}
                        />
                        匿名で返信
                      </label>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    if (followListMode) {
      return (
        <div className="card board">
          <button className="btn ghost back-btn" onClick={closeFollowList}>← 戻る</button>
          <div className="board-sub">{followListMode === "followers" ? "フォロワー" : "フォロー中"}</div>
          {feedError && <div className="error">{feedError}</div>}
          {followListLoading ? (
            <div className="empty">読み込み中…</div>
          ) : followListUsers.length === 0 ? (
            <div className="empty">該当するユーザーがいません。</div>
          ) : (
            <div className="feed">
              {followListUsers.map((u) => (
                <div
                  className="post-card"
                  key={u.id}
                  style={{ cursor: "pointer" }}
                  onClick={() => {
                    closeFollowList();
                    if (u.id === session.user.id) {
                      goToTab("user");
                    } else {
                      openProfile(u.id);
                    }
                  }}
                >
                  <div className="post-author">{u.handle}</div>
                  {u.username && <div className="profile-username" style={{ marginTop: 2 }}>@{u.username}</div>}
                  {u.bio && <div className="post-body" style={{ marginTop: 4 }}>{u.bio}</div>}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    if (viewedUserId) {
      return (
        <div className="card board">
          <button className="btn ghost back-btn" onClick={closeProfile}>← 戻る</button>
          {feedError && <div className="error">{feedError}</div>}
          {viewedLoading ? (
            <div className="empty">読み込み中…</div>
          ) : viewedProfile ? (
            <>
              <div className="profile-card">
                <div className="profile-handle">{viewedProfile.handle}</div>
                {viewedProfile.username && <div className="profile-username">@{viewedProfile.username}</div>}
                <div className="profile-meta">
                  <span className="follow-count-link" onClick={() => openFollowList(viewedUserId, "followers")}>
                    フォロワー {followerCount}
                  </span>
                  {" ・ "}
                  <span className="follow-count-link" onClick={() => openFollowList(viewedUserId, "following")}>
                    フォロー中 {followingCount}
                  </span>
                </div>
                {viewedProfile.bio && <div className="profile-bio">{viewedProfile.bio}</div>}
                <button
                  className={"btn" + (viewedFollowing ? " ghost" : "")}
                  style={{ marginTop: 16, width: "auto", padding: "10px 22px" }}
                  disabled={followBusy}
                  onClick={handleToggleFollow}
                >
                  {followBusy ? "…" : viewedFollowing ? "フォロー中" : "フォローする"}
                </button>
              </div>

              <div className="board-sub" style={{ marginTop: 22 }}>投稿</div>
              {viewedPostsLoading ? (
                <div className="empty">読み込み中…</div>
              ) : viewedPosts.length === 0 ? (
                <div className="empty">まだ投稿がありません。</div>
              ) : (
                <div className="feed">
                  {viewedPosts.map((p) => (
                    <div className="post-card" key={p.id}>
                      <div className="post-head">
                        <span className="my-post-board">
                          {boardInfo(p.board).emoji} {boardInfo(p.board).name}
                        </span>
                        <span className="post-time">{formatTime(p.created_at)}</span>
                      </div>
                      <div className="post-body">{p.body}</div>
                    </div>
                  ))}
                </div>
              )}
            </>
          ) : (
            <div className="empty">ユーザーが見つかりませんでした。</div>
          )}
        </div>
      );
    }

    return (
      <div className="card app-shell">
        <div className="shell-header">
          <div className="title">ちゃディ<span className="title-en">chatty</span></div>
        </div>
        <div
          className="shell-scroll"
          style={{ touchAction: "pan-y" }}
          onTouchStart={handleTabTouchStart}
          onTouchEnd={handleTabTouchEnd}
        >

        {activeTab === "home" && (
          <div className={"tab-panel slide-" + slideDir}>
            <div className="board-sub">🏠 フォロー中の投稿</div>
            {feedError && <div className="error">{feedError}</div>}
            {homeFeedLoading ? (
              <div className="empty">読み込み中…</div>
            ) : homeFeed.length === 0 ? (
              <div className="empty">
                まだ誰もフォローしていません。掲示板で気になる人をフォローすると、ここにその人の投稿が流れます。
              </div>
            ) : (
              <div className="feed">
                {homeFeed.map((p) => (
                  <div className="post-card" key={p.id} style={{ cursor: "pointer" }} onClick={() => goToPost(p.id)}>
                    <div className="post-head">
                      <span
                        className={"post-author" + (p.is_anonymous ? " anon" : "")}
                        onClick={(e) => {
                          e.stopPropagation();
                          if (!p.is_anonymous) openProfile(p.author_id);
                        }}
                      >
                        {p.author_handle}
                        {!p.is_anonymous && authorUsernames[p.author_id] && (
                          <span className="post-username">@{authorUsernames[p.author_id]}</span>
                        )}
                      </span>
                      <span className="post-time">{formatTime(p.created_at)}</span>
                    </div>
                    <div className="my-post-board" style={{ marginBottom: 4 }}>
                      {boardInfo(p.board).emoji} {boardInfo(p.board).name}
                    </div>
                    <div className="post-body">{p.body}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {activeTab === "board" && (
          <div className={"tab-panel slide-" + slideDir}>
            <div className="board-sub">{boardInfo(currentBoard).emoji} {boardInfo(currentBoard).name}</div>

            <div className="board-tabs-header">
              <button className="btn ghost reorder-toggle" onClick={() => setReorderMode((v) => !v)}>
                {reorderMode ? "完了" : "並び替え"}
              </button>
            </div>

            <div className="board-tabs">
              {boardOrder.map((id) => boardInfo(id)).map((b) => (
                <div className="board-tab-wrap" key={b.id}>
                  {reorderMode && (
                    <button
                      className="reorder-arrow"
                      disabled={boardOrder.indexOf(b.id) === 0}
                      onClick={() => moveBoardOrder(b.id, -1)}
                    >
                      ◀
                    </button>
                  )}
                  <button
                    className={"board-tab" + (currentBoard === b.id ? " active" : "")}
                    onClick={() => { if (!reorderMode) setCurrentBoard(b.id); }}
                  >
                    {b.emoji} {b.name}
                    {b.comingSoon && <span className="soon-badge">準備中</span>}
                  </button>
                  {reorderMode && (
                    <button
                      className="reorder-arrow"
                      disabled={boardOrder.indexOf(b.id) === boardOrder.length - 1}
                      onClick={() => moveBoardOrder(b.id, 1)}
                    >
                      ▶
                    </button>
                  )}
                </div>
              ))}
            </div>

            {boardInfo(currentBoard).comingSoon ? (
              <div className="comingsoon">
                <div className="comingsoon-emoji">{boardInfo(currentBoard).emoji}</div>
                <div className="comingsoon-title">準備中の掲示板です</div>
                <div className="comingsoon-text">この掲示板はまだオープンしていません。もう少しお待ちください!</div>
              </div>
            ) : (
              <>
                <form className="composer" onSubmit={handleCreatePost}>
                  <textarea
                    className="composer-textarea"
                    placeholder="いまどうしてる?"
                    value={newPostText}
                    onChange={(e) => setNewPostText(e.target.value)}
                  />

                  {composerFiles.length > 0 && (
                    <div className="media-preview-row">
                      {composerFiles.map((f, idx) => (
                        <div className="media-preview-item" key={idx}>
                          {f.type === "video" ? (
                            <video src={f.previewUrl} muted />
                          ) : (
                            <img src={f.previewUrl} alt="" />
                          )}
                          <button
                            type="button"
                            className="media-remove-btn"
                            onClick={() => removeComposerFile(idx)}
                          >
                            ✕
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                  {mediaError && <div className="error">{mediaError}</div>}

                  <div className="points-hint">
                    新しいスレッドには1pt必要 ・ 現在 {profile.points ?? 0}pt
                  </div>
                  <div className="composer-footer">
                    <label className="anon-toggle">
                      <input
                        type="checkbox"
                        checked={newPostAnonymous}
                        onChange={(e) => setNewPostAnonymous(e.target.checked)}
                      />
                      匿名で投稿
                    </label>
                    <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                      <label className="attach-btn">
                        📎
                        <input
                          type="file"
                          accept="image/*,video/*"
                          multiple
                          style={{ display: "none" }}
                          onChange={handleFilesSelected}
                        />
                      </label>
                      <button
                        className="btn"
                        type="submit"
                        disabled={
                          posting ||
                          mediaUploading ||
                          (!newPostText.trim() && composerFiles.length === 0) ||
                          (profile.points || 0) < 1
                        }
                        style={{ width: "auto", padding: "9px 20px", marginBottom: 0 }}
                      >
                        {posting || mediaUploading ? "投稿中…" : "投稿"}
                      </button>
                    </div>
                  </div>
                </form>

                {feedError && <div className="error">{feedError}</div>}

                {feedLoading ? (
                  <div className="empty">読み込み中…</div>
                ) : threads.length === 0 ? (
                  <div className="empty">まだ投稿がありません。最初の一件を書いてみましょう。</div>
                ) : (
                  <div className="feed">
                    {threads.map((p) => (
                      <div className="post-card" id={"post-" + p.id} key={p.id}>
                        <div className="post-head">
                          <span
                            className={"post-author" + (p.is_anonymous ? " anon" : "")}
                            onClick={() => { if (!p.is_anonymous) openProfile(p.author_id); }}
                          >
                            {p.author_handle}
                            {!p.is_anonymous && authorUsernames[p.author_id] && (
                              <span className="post-username">@{authorUsernames[p.author_id]}</span>
                            )}
                          </span>
                          <span className="post-time">{formatTime(p.created_at)}</span>
                        </div>
                        <div className="post-body">{p.body}</div>
                        {postMedia[p.id] && postMedia[p.id].length > 0 && (
                          <div className="post-media-grid">
                            {postMedia[p.id].map((m) => (
                              <div className="post-media-item" key={m.id}>
                                {m.media_type === "video" ? (
                                  <video src={mediaPublicUrl(m.path)} controls playsInline />
                                ) : (
                                  <img src={mediaPublicUrl(m.path)} alt="" loading="lazy" />
                                )}
                              </div>
                            ))}
                          </div>
                        )}
                        <div className="post-actions">
                          <button
                            className={"like-btn" + (likedSet.has(p.id) ? " liked" : "")}
                            onClick={() => handleToggleLike(p.id)}
                          >
                            {likedSet.has(p.id) ? "♥" : "♡"} {likeCounts[p.id] || 0}
                          </button>
                          <button className="reply-toggle-btn" onClick={() => handleToggleReplies(p.id)}>
                            💬 {replyCounts[p.id] || 0}
                          </button>
                          <button
                            className={"fav-btn" + (favoritedSet.has(p.id) ? " faved" : "")}
                            onClick={() => handleToggleFavorite(p.id)}
                            title={favoritedSet.has(p.id) ? "お気に入りから外す" : "お気に入りに追加"}
                          >
                            {favoritedSet.has(p.id) ? "★" : "☆"}
                          </button>
                        </div>

                        {expandedId === p.id && (
                          <div className="replies-block">
                            {repliesLoading[p.id] ? (
                              <div className="empty small">読み込み中…</div>
                            ) : (repliesByPost[p.id] || []).length === 0 ? (
                              <div className="empty small">まだ返信がありません。最初の返信を書いてみましょう。</div>
                            ) : (
                              (repliesByPost[p.id] || []).map((r) => {
                                const kids = (nestedRepliesByPost[p.id] && nestedRepliesByPost[p.id][r.id]) || [];
                                const kidsOpen = !!expandedReplyChildren[r.id];
                                return (
                                  <div key={r.id}>
                                    <div className="reply-card" id={"post-" + r.id}>
                                      <div className="reply-head">
                                        <span
                                          className={"reply-author" + (r.is_anonymous ? " anon" : "")}
                                          onClick={() => { if (!r.is_anonymous) openProfile(r.author_id); }}
                                        >
                                          {r.author_handle}
                                          {!r.is_anonymous && authorUsernames[r.author_id] && (
                                            <span className="post-username">@{authorUsernames[r.author_id]}</span>
                                          )}
                                        </span>
                                        <span className="post-time">{formatTime(r.created_at)}</span>
                                      </div>
                                      <div className="reply-body">{r.body}</div>
                                      <div className="reply-actions">
                                        <button
                                          className={"like-btn small" + (likedSet.has(r.id) ? " liked" : "")}
                                          onClick={() => handleToggleLike(r.id)}
                                        >
                                          {likedSet.has(r.id) ? "♥" : "♡"} {likeCounts[r.id] || 0}
                                        </button>
                                        <button
                                          className="reply-toggle-btn small"
                                          onClick={() =>
                                            setReplyTargetId((prev) => ({
                                              ...prev,
                                              [p.id]: { id: r.id, handle: r.author_handle, authorId: r.author_id },
                                            }))
                                          }
                                        >
                                          返信
                                        </button>
                                        <button
                                          className={"fav-btn small" + (favoritedSet.has(r.id) ? " faved" : "")}
                                          onClick={() => handleToggleFavorite(r.id)}
                                          title={favoritedSet.has(r.id) ? "お気に入りから外す" : "お気に入りに追加"}
                                        >
                                          {favoritedSet.has(r.id) ? "★" : "☆"}
                                        </button>
                                      </div>
                                    </div>

                                    {kids.length > 0 && (
                                      <button
                                        className="show-kids-btn"
                                        onClick={() =>
                                          setExpandedReplyChildren((prev) => ({ ...prev, [r.id]: !prev[r.id] }))
                                        }
                                      >
                                        {kidsOpen ? "▾ 返信を隠す" : "▸ 返信を表示 (" + kids.length + ")"}
                                      </button>
                                    )}

                                    {kidsOpen && (
                                      <div className="reply-kids">
                                        {kids.map((k) => (
                                          <div className="reply-card" id={"post-" + k.id} key={k.id}>
                                            <div className="reply-head">
                                              <span
                                                className={"reply-author" + (k.is_anonymous ? " anon" : "")}
                                                onClick={() => { if (!k.is_anonymous) openProfile(k.author_id); }}
                                              >
                                                {k.author_handle}
                                                {!k.is_anonymous && authorUsernames[k.author_id] && (
                                                  <span className="post-username">@{authorUsernames[k.author_id]}</span>
                                                )}
                                              </span>
                                              <span className="post-time">{formatTime(k.created_at)}</span>
                                            </div>
                                            <div className="reply-body">{k.body}</div>
                                            <div className="reply-actions">
                                              <button
                                                className={"like-btn small" + (likedSet.has(k.id) ? " liked" : "")}
                                                onClick={() => handleToggleLike(k.id)}
                                              >
                                                {likedSet.has(k.id) ? "♥" : "♡"} {likeCounts[k.id] || 0}
                                              </button>
                                              <button
                                                className="reply-toggle-btn small"
                                                onClick={() =>
                                                  setReplyTargetId((prev) => ({
                                                    ...prev,
                                                    [p.id]: { id: r.id, handle: k.author_handle, authorId: k.author_id },
                                                  }))
                                                }
                                              >
                                                返信
                                              </button>
                                              <button
                                                className={"fav-btn small" + (favoritedSet.has(k.id) ? " faved" : "")}
                                                onClick={() => handleToggleFavorite(k.id)}
                                                title={favoritedSet.has(k.id) ? "お気に入りから外す" : "お気に入りに追加"}
                                              >
                                                {favoritedSet.has(k.id) ? "★" : "☆"}
                                              </button>
                                            </div>
                                          </div>
                                        ))}
                                      </div>
                                    )}
                                  </div>
                                );
                              })
                            )}
                            {replyTargetId[p.id] && (
                              <div className="reply-target-pill">
                                → {replyTargetId[p.id].handle} への返信
                                <span
                                  className="reply-target-clear"
                                  onClick={() =>
                                    setReplyTargetId((prev) => {
                                      const next = { ...prev };
                                      delete next[p.id];
                                      return next;
                                    })
                                  }
                                >
                                  ✕
                                </span>
                              </div>
                            )}
                            <div className="reply-composer">
                              <input
                                className="reply-input"
                                placeholder="返信する…"
                                value={replyDrafts[p.id] || ""}
                                onChange={(e) =>
                                  setReplyDrafts((prev) => ({ ...prev, [p.id]: e.target.value }))
                                }
                                onKeyDown={(e) => {
                                  if (e.key === "Enter") handleCreateReply(p.id);
                                }}
                              />
                              <button
                                className="btn"
                                style={{ width: "auto", padding: "7px 14px", marginBottom: 0 }}
                                disabled={postingReply[p.id] || !(replyDrafts[p.id] || "").trim()}
                                onClick={() => handleCreateReply(p.id)}
                              >
                                {postingReply[p.id] ? "…" : "送信"}
                              </button>
                            </div>
                            <label className="anon-toggle" style={{ marginTop: 6 }}>
                              <input
                                type="checkbox"
                                checked={!!replyAnonDrafts[p.id]}
                                onChange={(e) =>
                                  setReplyAnonDrafts((prev) => ({ ...prev, [p.id]: e.target.checked }))
                                }
                              />
                              匿名で返信
                            </label>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </>
            )}
          </div>
        )}

        {activeTab === "search" && (
          <div className={"tab-panel slide-" + slideDir}>
            <div className="board-sub">🔍 検索</div>
            <form className="search-row" onSubmit={handleSearch}>
              <input
                className="edit-input"
                placeholder="ユーザー名やキーワードで検索"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
              />
              <button
                className="btn"
                type="submit"
                disabled={searching || !searchQuery.trim()}
                style={{ width: "auto", padding: "9px 16px", marginBottom: 0 }}
              >
                {searching ? "…" : "検索"}
              </button>
            </form>

            {feedError && <div className="error">{feedError}</div>}

            <div className="board-sub">ユーザー</div>
            {searchUsers.length === 0 ? (
              <div className="empty small">該当するユーザーが見つかりません。</div>
            ) : (
              <div className="feed">
                {searchUsers.map((u) => (
                  <div className="post-card" key={u.id} style={{ cursor: "pointer" }} onClick={() => openProfile(u.id)}>
                    <div className="post-author">{u.handle}</div>
                    {u.bio && <div className="post-body" style={{ marginTop: 4 }}>{u.bio}</div>}
                  </div>
                ))}
              </div>
            )}

            <div className="board-sub" style={{ marginTop: 16 }}>スレッド</div>
            {searchThreads.length === 0 ? (
              <div className="empty small">該当するスレッドが見つかりません。</div>
            ) : (
              <div className="feed">
                {searchThreads.map((p) => (
                  <div className="post-card" key={p.id}>
                    <div className="post-head">
                      <span className="post-author">
                        {p.author_handle}
                        {!p.is_anonymous && authorUsernames[p.author_id] && (
                          <span className="post-username">@{authorUsernames[p.author_id]}</span>
                        )}
                      </span>
                      <span className="post-time">{formatTime(p.created_at)}</span>
                    </div>
                    <div className="my-post-board" style={{ marginBottom: 4 }}>
                      {boardInfo(p.board).emoji} {boardInfo(p.board).name}
                    </div>
                    <div className="post-body">{p.body}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {activeTab === "user" && (
          <div className={"tab-panel slide-" + slideDir}>
            <div className="profile-card">
              <div className="profile-handle">{profile.handle}</div>
              {profile.username && <div className="profile-username">@{profile.username}</div>}
              <div className="profile-meta">
                <span className="follow-count-link" onClick={() => openFollowList(session.user.id, "followers")}>
                  フォロワー {myFollowerCount}
                </span>
                {" ・ "}
                <span className="follow-count-link" onClick={() => openFollowList(session.user.id, "following")}>
                  フォロー中 {myFollowingCount}
                </span>
              </div>
              <div className="points-display">🪙 {profile.points ?? 0} pt</div>
              {profile.bio && <div className="profile-bio">{profile.bio}</div>}
              <div className="profile-btn-row">
                <button
                  className="btn ghost"
                  style={{ width: "auto", padding: "7px 16px", marginTop: 12, position: "relative" }}
                  onClick={openNotifications}
                >
                  🔔 お知らせ
                  {notifUnreadCount > 0 && <span className="notif-badge">{notifUnreadCount}</span>}
                </button>
                <button
                  className="btn ghost"
                  style={{ width: "auto", padding: "7px 16px", marginTop: 12 }}
                  onClick={() => setEditingProfile((v) => !v)}
                >
                  {editingProfile ? "編集をやめる" : "✏️ プロフィールを編集"}
                </button>
                <button
                  className="btn ghost"
                  style={{ width: "auto", padding: "7px 16px", marginTop: 12 }}
                  onClick={handleLogout}
                >
                  ログアウト
                </button>
              </div>
            </div>

            {editingProfile && (
              <div className="profile-edit">
                <label className="edit-label">テーマカラー</label>
                <div className="theme-swatches">
                  {THEMES.map((th) => (
                    <button
                      key={th.id}
                      className={"theme-swatch" + (themeDraft === th.id ? " selected" : "")}
                      style={{ background: th.swatch }}
                      onClick={() => {
                        setThemeDraft(th.id);
                        applyTheme(th.id); // すぐにプレビュー反映
                      }}
                      title={th.name}
                    />
                  ))}
                </div>

                <label className="edit-label" style={{ marginTop: 14 }}>ハンドルネーム</label>
                <input
                  className="edit-input"
                  value={handleDraft}
                  onChange={(e) => setHandleDraft(e.target.value)}
                />
                <div className="username-hint">ユーザーID: @{profile.username || "未設定"}(登録時のみ設定可・変更不可)</div>
                <label className="edit-label">自己紹介</label>
                <textarea
                  className="composer-textarea"
                  placeholder="自己紹介を書いてみましょう"
                  value={bioDraft}
                  onChange={(e) => setBioDraft(e.target.value)}
                />
                {profileSaveError && <div className="error">{profileSaveError}</div>}
                {profileSaveNotice && <div className="notice">{profileSaveNotice}</div>}
                <button
                  className="btn"
                  disabled={savingProfile}
                  onClick={saveProfileEdits}
                  style={{ width: "auto", padding: "9px 20px" }}
                >
                  {savingProfile ? "保存中…" : "保存"}
                </button>
              </div>
            )}

            <div className="sub-tab-row">
              <button
                className={"sub-tab-btn" + (userSubTab === "posts" ? " active" : "")}
                onClick={() => setUserSubTab("posts")}
              >
                あなたの投稿
              </button>
              <button
                className={"sub-tab-btn" + (userSubTab === "favorites" ? " active" : "")}
                onClick={() => setUserSubTab("favorites")}
              >
                お気に入り
              </button>
            </div>

            {userSubTab === "posts" ? (
              myPostsLoading ? (
                <div className="empty">読み込み中…</div>
              ) : myPosts.length === 0 ? (
                <div className="empty">まだ投稿がありません。</div>
              ) : (
                <div className="feed">
                  {myPosts.map((p) => (
                    <div className="post-card" key={p.id}>
                      <div className="post-head">
                        <span className="my-post-board">
                          {boardInfo(p.board).emoji} {boardInfo(p.board).name}
                          {p.is_anonymous && <span className="anon-badge">匿名</span>}
                        </span>
                        <span className="post-time">{formatTime(p.created_at)}</span>
                      </div>
                      <div className="post-body">{p.body}</div>
                    </div>
                  ))}
                </div>
              )
            ) : myFavLoading ? (
              <div className="empty">読み込み中…</div>
            ) : myFavPosts.length === 0 ? (
              <div className="empty">まだお気に入りがありません。投稿の☆ボタンで追加できます。</div>
            ) : (
              <div className="feed">
                {myFavPosts.map((p) => (
                  <div className="post-card" key={p.id}>
                    <div className="post-head">
                      <span className="my-post-board">
                        {boardInfo(p.board).emoji} {boardInfo(p.board).name}
                      </span>
                      <span className="post-time">{formatTime(p.created_at)}</span>
                    </div>
                    <div className="post-body">{p.body}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
        </div>

        <div className="shell-nav">
          <div className="bottom-nav">
            <button className={"nav-btn" + (activeTab === "home" ? " active" : "")} onClick={() => goToTab("home")}>
              <span className="nav-icon"><IconHome /></span><span>メイン</span>
            </button>
            <button className={"nav-btn" + (activeTab === "board" ? " active" : "")} onClick={() => goToTab("board")}>
              <span className="nav-icon"><IconBoard /></span><span>掲示板</span>
            </button>
            <button className={"nav-btn" + (activeTab === "search" ? " active" : "")} onClick={() => goToTab("search")}>
              <span className="nav-icon"><IconSearch /></span><span>検索</span>
            </button>
            <button className={"nav-btn" + (activeTab === "user" ? " active" : "")} onClick={() => goToTab("user")}>
              <span className="nav-icon"><IconUser /></span><span>ユーザー</span>
            </button>
          </div>
        </div>
      </div>
    );
  }


  if (session && !profile) {
    return (
      <div className="card">
        <div className="title">ちゃディ<span className="title-en">chatty</span></div>
        <div className="sub">最後にふたつだけ — ユーザーIDとハンドルネームを決めてください</div>
        {error && <div className="error">{error}</div>}
        <form onSubmit={createProfile}>
          <label>ユーザーID(重複不可・後から変更できません)</label>
          <input
            value={signupUsername}
            onChange={(e) => setSignupUsername(e.target.value)}
            placeholder="半角英数字と_のみ、3〜20文字"
          />
          <label>ハンドルネーム(空欄でも可)</label>
          <input value={handle} onChange={(e) => setHandle(e.target.value)} placeholder="例: Yuki, Marco..." />
          <button className="btn" type="submit" disabled={busy}>{busy ? "作成中…" : "はじめる"}</button>
        </form>
      </div>
    );
  }

  return (
    <div className="card">
      <div className="title">ちゃディ<span className="title-en">chatty</span></div>
      <div className="sub">世界中の人と、ささいな話を。</div>

      {error && <div className="error">{error}</div>}
      {notice && <div className="notice">{notice}</div>}

      <form onSubmit={handleEmailAuth}>
        <label>メールアドレス</label>
        <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required />
        <label>パスワード</label>
        <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required minLength={6} />
        <button className="btn" type="submit" disabled={busy}>
          {busy ? "処理中…" : mode === "signup" ? "登録する" : "ログイン"}
        </button>
      </form>

      <div className="divider">または</div>
      <button className="btn google" onClick={handleGoogleAuth}>Googleで{mode === "signup" ? "登録" : "ログイン"}</button>

      <div className="toggle">
        {mode === "signup" ? (
          <>すでにアカウントをお持ちですか? <a onClick={() => setMode("login")}>ログイン</a></>
        ) : (
          <>アカウントをお持ちでないですか? <a onClick={() => setMode("signup")}>新規登録</a></>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
